  - "Survivorship established as \u2014 delisted prices: Survivors only, delisted\
    \ universe membership: Partial. Basis: QUERIED 2026-08-01. Prices: ohlcv returned\
    \ zero rows for COH (Coach, Inc., delisted October 2017) in both windows tried,\
    \ 2015-01-05 to 2015-01-16 and 2017-10-16 to 2017-10-26, while AAPL returned rows\
    \ over the latter, so the empty result is a property of the symbol and not of\
    \ the query. Universe: the symbol table returned COH with last_seen 2017-10-26,\
    \ and COUNT(*) returned 23,827 rows. INFERRED, not queried: that the price table\
    \ therefore carries currently-listed symbols only (two delisted samples, not an\
    \ exhaustive check); that 23,827 exceeds the number of currently-listed US stocks,\
    \ which is external knowledge of roughly 6,000 rather than a query result; and\
    \ that accumulation began on 2017-10-26, which the ORDER BY only shows to be the\
    \ earliest last_seen retained. ESTABLISHED: membership is reconstructable as last_seen\
    \ >= date, and there is no first-seen column, so a symbol not yet listed on a\
    \ past date cannot be excluded. Survivorship bias INFLATES every return measure\
    \ and DEFLATES drawdown and tail measures SIMULTANEOUSLY, because the instruments\
    \ that failed have already been removed from the sample. It flatters the return\
    \ and understates the risk in one breath, so a result that looks acceptable on\
    \ both axes may be unacceptable on both. It cannot be corrected from the data\
    \ itself; ADR-012 rule 10 refuses to produce a number that looks adjusted and\
    \ is not, so it is disclosed instead. ADR-013 rule 5."
