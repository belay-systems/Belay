[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "belay"
version = "1.0.0a0"
description = "Evidence-driven investment intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# Runtime dependencies. This is the single source of truth for what Belay needs;
# it supersedes the former framework/requirements.txt.
# `pandas`, `jinja2` and `python-dateutil` were removed 2026-09-25 on the owner's
# ruling (F-036, `docs/OwnerDecisions.md` Part 35). All three were declared and
# imported by no file under `framework/`, `scripts/`, `tests/` or `departments/`.
#
# `numpy` was NOT declared in their place, and that is the ruled choice rather than
# an omission. It arrived only as a transitive dependency of `pandas` and is
# imported nowhere; `framework/metrics/distributions.py` explains at its head why
# Belay computes the one distribution it needs in thirty-five checkable lines
# instead. If numerical work later wants it, declare it then — building on an
# undeclared package is the 2026-07-26 defect from the other side.
dependencies = [
    "pyyaml>=6.0",
    "networkx>=3.4",
    "rich>=14.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "markdown-it-py>=2.2.0"]

# Packages are listed explicitly rather than auto-discovered. The repository root
# also holds governance directories (constitution/, Knowledge/, strategies/, ...)
# which are prose, not importable code, and would break flat-layout discovery.
# Per ADR-002 only the mechanics layer is packaged.
[tool.setuptools]
packages = [
    "framework",
    "framework.artifacts",
    "framework.metrics",
    "framework.services",
    "framework.workflows",
    "departments",
    "departments.Research",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the repository root on the import path so a bare `pytest` works without
# requiring an editable install first.
pythonpath = ["."]
